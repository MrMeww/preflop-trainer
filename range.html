<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range Viewer — MTT 8-max</title>
<style>
  :root{--bg:#0f1419;--card:#1b232c;--line:#2b3743;--ink:#e8edf2;--dim:#8a99a8;--accent:#4f8cff;--fold:#6b7785;--call:#4f8cff;--raise:#f0a020;--jam:#ff5d6c;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:640px;padding:18px 16px 40px}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs a{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;text-decoration:none;color:var(--dim);border:1px solid var(--line)}
  .tabs a.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .disc{font-size:11px;color:var(--dim);margin-bottom:12px} .disc b{color:#aab6c2}
  .ctrl{display:flex;align-items:center;gap:10px;margin-bottom:7px} .ctrl.hide{display:none}
  .ctrl-lbl{width:50px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;flex:none}
  .btns{display:flex;gap:5px;flex-wrap:wrap}
  .btns button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:.1s;min-width:42px}
  .btns button:hover{border-color:#41525f} .btns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ctx{color:var(--dim);font-size:13px;margin:6px 0 10px} .ctx b{color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;width:100%}
  .cell{position:relative;aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,2.6vw,15px);font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85);cursor:default;overflow:hidden}
  .cell.pair{outline:1px solid rgba(255,255,255,.25)}
  .legend{display:flex;gap:14px;margin-top:14px;font-size:13px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px;color:var(--dim)} .sw{width:14px;height:14px;border-radius:3px;display:inline-block}
  .detail{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;min-height:42px}
  .detail .dhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px} .detail .dhead b{font-size:18px} .detail .dhead .dh-key{color:var(--dim);font-size:12px}
  .stack-bar{display:flex;width:100%;height:30px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
  .seg{display:flex;align-items:center;justify-content:center;gap:5px;color:#0d1116;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;min-width:0}
  .seg.dark{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .keys{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap;font-size:12px}
  .keys span{display:flex;align-items:center;gap:6px;color:var(--dim)} .keys i{width:11px;height:11px;border-radius:3px;display:inline-block} .keys b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs"><a href="index.html">Trainer</a><a href="range.html" class="on">Range Viewer</a></div>
  <div class="disc"><b>MTT · 8-max · Chip-EV</b> — ranges assume chip-EV, <b>no ICM</b> (bubble / pay-jump effects not modeled).</div>
  <div class="ctrl"><span class="ctrl-lbl">Spot</span><div class="btns" id="b-spot"></div></div>
  <div class="ctrl" id="r-hero"><span class="ctrl-lbl">Hero</span><div class="btns" id="b-hero"></div></div>
  <div class="ctrl" id="r-vs"><span class="ctrl-lbl">Vs</span><div class="btns" id="b-vs"></div></div>
  <div class="ctrl"><span class="ctrl-lbl">Stack</span><div class="btns" id="b-depth"></div></div>
  <div class="ctrl" id="r-size"><span class="ctrl-lbl">3-bet</span><div class="btns" id="b-size"></div></div>
  <div class="ctx" id="ctx"></div>
  <div class="grid" id="grid"></div>
  <div class="legend" id="legend"></div>
  <div class="detail" id="detail">Hover or tap a cell to see its exact mix.</div>
</div>

<script src="engine.js"></script>
<script>
const $=id=>document.getElementById(id);
const COLOR={fold:"#6b7785",call:"#4f8cff",raise:"#f0a020",allin:"#ff5d6c"};
const SPOT_LABEL={rfi:"RFI (open)",vs_rfi:"vs RFI",bb_defend:"BB defend",vs_3bet:"vs 3-bet"};
const POS_ORDER=["UTG","UTG1","LJ","HJ","CO","BTN","SB","BB"], SPOT_ORDER=["rfi","vs_rfi","bb_defend","vs_3bet"];
const posSort=a=>[...a].sort((x,y)=>POS_ORDER.indexOf(x)-POS_ORDER.indexOf(y)), posLabel=p=>p==="UTG1"?"UTG+1":p;
const DARK=new Set(["fold","call","allin"]);
let NODES=[], sel={spot_type:null,hero_pos:null,vs_pos:null,depth:null,threebet_to_bb:null};
const distinct=a=>[...new Set(a)];
function fillBtns(id,opts,field,fmt){
  if(!opts.map(String).includes(String(sel[field]))) sel[field]=opts.length?opts[0]:null;
  $(id).innerHTML=opts.map(o=>`<button class="${String(o)===String(sel[field])?"on":""}" data-v="${o}">${fmt?fmt(o):o}</button>`).join("");
  $(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{sel[field]=b.dataset.v;refresh();});
}
function refresh(){
  let c=NODES.filter(n=>!sel.spot_type||n.spot_type===sel.spot_type);
  fillBtns("b-hero",posSort(distinct(c.map(n=>n.hero_pos))),"hero_pos",posLabel);
  c=c.filter(n=>n.hero_pos===sel.hero_pos);
  const vss=posSort(distinct(c.map(n=>n.vs_pos).filter(Boolean))), hasVs=vss.length>0;
  $("r-vs").classList.toggle("hide",!hasVs);
  if(hasVs)fillBtns("b-vs",vss,"vs_pos",posLabel); else sel.vs_pos=null;
  c=c.filter(n=>!hasVs||n.vs_pos===sel.vs_pos);
  fillBtns("b-depth",distinct(c.map(n=>n.depth)).sort((a,b)=>a-b),"depth",d=>d+"bb");
  c=c.filter(n=>n.depth==sel.depth);
  const sizes=distinct(c.map(n=>n.threebet_to_bb).filter(v=>v!=null)).sort((a,b)=>a-b), hasSize=sizes.length>0;
  $("r-size").classList.toggle("hide",!hasSize);
  if(hasSize)fillBtns("b-size",sizes,"threebet_to_bb",v=>v+"bb"); else sel.threebet_to_bb=null;
  loadGrid();
}
function cellBg(mix){
  if(mix.length===1)return COLOR[mix[0].action]||"#888";
  let acc=0; const stops=mix.map(m=>{const a=acc,b=acc+m.freq*100;acc=b;return `${COLOR[m.action]||"#888"} ${a}% ${b}%`;});
  return `linear-gradient(to right,${stops.join(",")})`;
}
function loadGrid(){
  const node=Engine.findNode(sel.spot_type,sel.hero_pos,sel.vs_pos,Number(sel.depth),sel.threebet_to_bb!=null?Number(sel.threebet_to_bb):null);
  if(!node){ $("grid").innerHTML=""; $("ctx").textContent="no range for that combination"; return; }
  const vs=node.vs_pos?` vs <b>${posLabel(node.vs_pos)}</b>`:"", sz=node.threebet_to_bb!=null?` · 3-bet to ${node.threebet_to_bb}bb`:"";
  $("ctx").innerHTML=`<b>${SPOT_LABEL[node.spot_type]||node.spot_type}</b> · <b>${posLabel(node.hero_pos)}</b>${vs} · <b>${node.depth}bb</b>${sz}`;
  const LEG={allin:0,raise:1,call:2,fold:3};
  $("legend").innerHTML=[...node.legal_actions].sort((a,b)=>LEG[a]-LEG[b]).map(a=>`<span><i class="sw" style="background:${COLOR[a]||"#888"}"></i>${Engine.actionLabel(a,node.spot_type)}</span>`).join("");
  const grid=Engine.buildGrid(node), cells=[];
  grid.forEach(row=>row.forEach(c=>{const pair=c.key.length===2;
    cells.push(`<div class="cell ${pair?"pair":""}" style="background:${cellBg(c.mix)}" data-mix='${JSON.stringify(c.mix)}' data-key="${c.key}">${c.key}</div>`);}));
  $("grid").innerHTML=cells.join("");
  const lblOf=a=>Engine.actionLabel(a,node.spot_type);
  $("grid").querySelectorAll(".cell").forEach(el=>{
    const show=()=>{const mix=JSON.parse(el.dataset.mix);
      const segs=mix.map(m=>{const pct=Math.round(m.freq*100);const inside=m.freq>=0.14?`${lblOf(m.action)} ${pct}%`:(m.freq>=0.06?`${pct}%`:"");
        return `<span class="seg ${DARK.has(m.action)?"dark":""}" style="flex:${m.freq};background:${COLOR[m.action]}" title="${lblOf(m.action)} ${pct}%">${inside}</span>`;}).join("");
      const keys=mix.map(m=>`<span><i style="background:${COLOR[m.action]}"></i>${lblOf(m.action)} <b>${Math.round(m.freq*100)}%</b></span>`).join("");
      $("detail").innerHTML=`<div class="dhead"><b>${el.dataset.key}</b><span class="dh-key">GTO mix</span></div><div class="stack-bar">${segs}</div><div class="keys">${keys}</div>`;};
    el.addEventListener("mouseenter",show); el.addEventListener("click",show);
  });
}
(async function init(){
  await Engine.load();
  NODES=Engine.nodes();
  fillBtns("b-spot",distinct(NODES.map(n=>n.spot_type)).sort((a,b)=>SPOT_ORDER.indexOf(a)-SPOT_ORDER.indexOf(b)),"spot_type",s=>SPOT_LABEL[s]||s);
  $("b-spot").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel.spot_type=b.dataset.v;refresh();});
  refresh();
})();
</script>
</body>
</html>
